<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bildirim yönetimi · Tarih</title><style>
/* SHARED_STYLE */
.admin-wrap{max-width:1140px;margin:auto;padding:32px 24px 70px}.admin-header{padding-bottom:25px;border-bottom:1px solid var(--line);margin-bottom:30px}.admin-login{max-width:460px;margin:8vh auto}.report-text{white-space:pre-wrap;overflow-wrap:anywhere}textarea{font:inherit;border:1px solid #bfcbd9;border-radius:8px;padding:12px;width:100%;resize:vertical;color:var(--ink)}.admin-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.admin-metrics b{font-size:26px;display:block}.admin-row{width:100%;text-align:left;color:var(--ink);padding:22px;background:white;border-bottom:1px solid var(--line)}.admin-row:hover{background:#f3f6ff}.admin-row p{margin:10px 0;overflow-wrap:anywhere}.error-line{color:var(--red);margin:16px 0;white-space:pre-wrap}li{overflow-wrap:anywhere}.admin-detail-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px}@media(max-width:700px){.admin-wrap{padding:22px 16px}.admin-metrics{grid-template-columns:1fr 1fr}.admin-metrics .pad{padding:16px}.admin-detail-grid{grid-template-columns:1fr}}
</style></head><body><main class="admin-wrap"><header class="row between wrap admin-header"><div><p class="eyebrow muted">Tarih · Yönetim</p><h1 style="margin-top:8px">Soru bildirimleri</h1></div><div class="row wrap"><a class="btn secondary" href="/?sayfa=profil">Uygulamaya dön</a><button id="logout" class="btn ghost" hidden>Yönetimden çık</button></div></header><div id="alert" role="status" aria-live="polite"></div><div id="panel">Yönetim ekranı açılıyor…</div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s),statuses={new:'Yeni',reviewing:'İnceleniyor',resolved:'Düzeltildi',no_change:'Değişiklik gerekmiyor'},categories={answer:'Bilgi / cevap hatası',multiple:'Birden fazla doğru cevap',unclear:'Belirsiz soru kökü',explanation:'Açıklama sorunu',typo:'Yazım hatası',other:'Diğer'};
let signed=false,busy=false,page=1,filter='all',detail=null,pendingRoute=false,restoring=false;
function rememberAdmin(id){if(restoring||pendingRoute)return;const p=new URLSearchParams({durum:filter,sayfa:String(page)});if(id)p.set('bildirim',id);const url='/yonetim?'+p;history[location.pathname+location.search===url?'replaceState':'pushState']({},'',url);}
async function restoreAdmin(){const p=new URLSearchParams(location.search);filter=p.get('durum')||'all';if(filter!=='all'&&!statuses[filter])filter='all';page=Math.max(1,Number(p.get('sayfa'))||1);const id=p.get('bildirim');restoring=true;try{if(/^[a-f0-9-]{36}$/.test(id||''))await open(id);else await list();}finally{restoring=false;}}
window.addEventListener('popstate',()=>{pendingRoute=true;if(!busy){pendingRoute=false;void run(restoreAdmin);}});
/* REQUEST_JSON */
async function request(path,body){try{return await requestJSON('/api/admin'+path,body);}catch(e){if(e.status===401){signed=false;detail=null;login();}throw e;}}
function notice(text,error=false){$('#alert').className=error?'error-line':'notice';$('#alert').textContent=text;}
async function run(fn){if(busy)return;busy=true;document.documentElement.setAttribute('aria-busy','true');try{await fn();}catch(e){notice(e.message||'Bağlantı kurulamadı. Alanların korunuyor; yeniden deneyebilirsin.',true);}finally{busy=false;document.documentElement.removeAttribute('aria-busy');if(pendingRoute){pendingRoute=false;queueMicrotask(()=>run(restoreAdmin));}}}
function login(){$('#logout').hidden=true;$('#panel').innerHTML=`<section class="card pad admin-login"><h2>Yönetici girişi</h2><p class="lead">Bildirimleri incelemek için yönetici anahtarını gir. Öğrenci takma adı yönetici erişimi sağlamaz.</p><form id="login-form" class="stack" style="margin-top:25px"><label class="field">Yönetici anahtarı<input type="password" name="key" required autocomplete="off" spellcheck="false" maxlength="80"></label><button class="btn">Yönetim ekranını aç</button></form><p class="small muted" style="margin-top:18px">Yerel pilotta anahtar, bilgisayarındaki yonetici-anahtari.txt dosyasında bulunur. Kurtarma kodundan farklıdır. Yönetici oturumu 8 saat sürer.</p></section>`;}
async function list(){const data=await request('/reports?page='+page+'&status='+filter);if(pendingRoute)return;detail=null;rememberAdmin();$('#logout').hidden=false;$('#panel').innerHTML=`<p class="lead">Bildirilen soruyu çözüldüğü sürümüyle incele, durumunu ve karar gerekçesini kaydet.</p><div class="admin-metrics">${Object.entries(statuses).map(([v,t])=>`<div class="card pad"><b>${data.counts[v]}</b><span class="small muted">${t}</span></div>`).join('')}</div><div class="row between wrap" style="margin-bottom:18px"><label class="field">Duruma göre filtrele<select id="status-filter">${[['all','Tüm bildirimler'],...Object.entries(statuses)].map(([v,t])=>`<option value="${v}" ${v===filter?'selected':''}>${t}</option>`).join('')}</select></label><button class="btn secondary" data-refresh>Listeyi yenile</button></div><section class="card" style="overflow:hidden">${data.reports.length?data.reports.map(r=>`<button class="admin-row" data-id="${r.id}"><div class="row between wrap"><strong>${esc(categories[r.category])}</strong><span class="pill">${esc(statuses[r.status])}</span></div><p>${esc(r.stem.slice(0,220))}</p><span class="small muted">${esc(r.questionId)} · Sürüm ${r.revision} · ${esc(r.nickname)} · ${new Date(r.createdAt).toLocaleDateString('tr-TR')}</span><span class="small" style="display:block;margin-top:10px;color:var(--blue)">Bildirimi incele →</span></button>`).join(''):'<div class="empty"><h2>Bu listede bildirim yok.</h2><p>Öğrencilerin soru ve çözüm ekranlarından gönderdikleri bildirimler burada görünecek.</p></div>'}</section><div class="row wrap" style="margin-top:20px"><button class="btn secondary" data-page="${page-1}" ${page<=1?'disabled':''}>Önceki sayfa</button><span class="small muted">${data.total} bildirim · Sayfa ${page}</span><button class="btn secondary" data-page="${page+1}" ${page*20>=data.total?'disabled':''}>Sonraki sayfa</button></div>`;}
async function open(id){const loaded=await request('/reports/'+id);if(pendingRoute)return;detail=loaded;rememberAdmin(id);const r=detail,q=r.question;$('#logout').hidden=false;$('#panel').innerHTML=`<button class="text-btn" data-back>← Bildirim listesi</button><div class="row between wrap" style="margin:20px 0"><h2>${esc(categories[r.category])}</h2><span class="pill">${esc(statuses[r.status])}</span></div><div class="admin-detail-grid"><section class="card pad"><p class="small muted">${esc(q.id)} · Bildirilen sürüm ${r.revision} · Güncel sürüm ${r.currentRevision??'Yayında değil'}</p>${r.currentRevision!==r.revision?'<p class="notice">Öğrencinin gördüğü sürüm güncel bankadan farklı. Kararını bu farkı dikkate alarak ver.</p>':''}<h2 class="report-text" style="margin:20px 0">${esc(q.stem)}</h2><ol type="A">${q.options.map(o=>`<li style="margin:10px 0">${esc(o)}</li>`).join('')}</ol><p><strong>Kayıtlı doğru cevap: ${esc(q.answer)}</strong></p><p class="report-text" style="margin-top:12px">${esc(q.explanation)}</p><details><summary>Soru kaynakları</summary>${(q.sources||[]).map(s=>`<a target="_blank" rel="noopener noreferrer" href="${/^https:\/\//.test(s.url)?esc(s.url):'#'}">${esc(s.title)}</a>`).join('')}</details></section><section class="stack"><div class="card pad"><h3>Öğrencinin bildirimi</h3><p class="small muted" style="margin-top:8px">${esc(r.nickname)} · ${new Date(r.createdAt).toLocaleString('tr-TR')}</p><p class="report-text" style="margin-top:15px">${esc(r.detail||'Ek açıklama yazılmadı.')}</p></div><div class="card pad"><h3>İnceleme kararı</h3><p class="small muted" style="margin-top:10px">Bu ekran bildirim durumunu kaydeder. “Düzeltildi” seçeneğini, soru düzeltmesi gerçekten uygulandıktan sonra kullan.</p><form id="decision-form" class="stack" style="margin-top:18px"><label class="field">Yeni durum<select name="status">${(r.status==='new'||['resolved','no_change'].includes(r.status)?['reviewing']:['reviewing','resolved','no_change']).map(s=>`<option value="${s}">${s==='reviewing'&&r.status!=='new'?'Yeniden / devam eden inceleme':statuses[s]}</option>`).join('')}</select></label><label class="field">Karar gerekçesi<textarea name="decision" maxlength="1500" rows="4" placeholder="Öğrencinin anlayabileceği kısa bir gerekçe yaz."></textarea></label><p class="small muted">Sonuçlandırırken gerekçe zorunludur. Açıklama öğrenciyle paylaşılır.</p><button class="btn">İncelemeyi kaydet</button></form></div><div class="card pad"><h3>İşlem geçmişi</h3><p class="small muted" style="margin-top:10px">Yeni · ${new Date(r.createdAt).toLocaleString('tr-TR')}</p>${r.history.map(e=>`<div style="border-top:1px solid var(--line);margin-top:15px;padding-top:15px"><strong class="small">${esc(statuses[e.status])} · ${new Date(e.created_at).toLocaleString('tr-TR')}</strong><p class="small report-text">${esc(e.decision)}</p></div>`).join('')}</div></section></div>`;}
document.addEventListener('submit',e=>{e.preventDefault();if(busy)return;const data=Object.fromEntries(new FormData(e.target));if(e.target.id==='login-form'){const field=e.target.elements.key;void run(async()=>{try{await request('/login',data);signed=true;notice('Yönetici oturumu açıldı.');await restoreAdmin();}finally{field.value='';}});}if(e.target.id==='decision-form')void run(async()=>{const id=detail.id;await request('/reports/'+id,{...data,version:detail.version});await open(id);notice('İnceleme kaydedildi.');});});
document.addEventListener('change',e=>{if(e.target.id==='status-filter'){filter=e.target.value;page=1;void run(list);}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.id)void run(()=>open(b.dataset.id));if(b.hasAttribute('data-back')||b.hasAttribute('data-refresh'))void run(list);if(b.dataset.page){page=Number(b.dataset.page);void run(list);}if(b.id==='logout')void run(async()=>{await request('/logout',{});signed=false;detail=null;login();notice('Yönetici oturumu kapatıldı.');});});
void run(async()=>{try{await request('/me');signed=true;await restoreAdmin();}catch(e){if(e.status===401)login();else throw e;}});
</script></body></html>
