<body><a class="skip" href="#main">İçeriğe geç</a><div id="app"><div class="loading">Soru bankası açılıyor…</div></div><div id="message" role="status" aria-live="polite"></div><dialog id="confirm"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="row"><button class="btn secondary" id="cancel">Vazgeç</button><button class="btn" id="accept">Devam et</button></div></dialog>
<script>
const BANK_TOTAL=__BANK_TOTAL__;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paths={book:'M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-3H4z M13 7a3 3 0 0 1 3-3h4v14h-3a4 4 0 0 0-4 3',grid:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',repeat:'M4 8a8 8 0 0 1 14-3l3 3 M21 3v5h-5 M20 16a8 8 0 0 1-14 3l-3-3 M3 21v-5h5',chart:'M4 20V11 M10 20V4 M16 20v-7 M22 20H2',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M4 21a8 8 0 0 1 16 0',arrow:'M4 12h16 M14 6l6 6-6 6',check:'M5 12l4 4L19 6',x:'M6 6l12 12 M6 18L18 6',info:'M12 8h.01 M12 11v5 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',target:'M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0 M17 12a5 5 0 1 1-10 0 5 5 0 0 1 10 0 M12 12h.01',key:'M14 6a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M10 13l-7 7 M4 19l-1-1 M7 16l-1-1',clock:'M12 7v5l3 2 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0'};
const icon=n=>`<svg aria-hidden="true" viewBox="0 0 24 24"><path d="${paths[n]||paths.book}"/></svg>`;
const state={me:null,view:'home',test:null,index:0,selected:null,group:'all',mode:'practice',count:10,recover:false,code:null,wrongs:[],reviewPage:1,studySummary:null};
const labels={home:'Soru bankası',wrong:'Yanlışlarım',progress:'İlerlemem',profile:'Profilim',reports:'Bildirimlerim',setup:'Yeni test',test:'Test çözümü',result:'Test sonucu'};
let busy=false,toastTimer;
function toast(message,error=false){clearTimeout(toastTimer);$('#message').innerHTML=`<div class="toast ${error?'error':''}">${esc(message)}</div>`;toastTimer=setTimeout(()=>$('#message').innerHTML='',6500);}
/* REQUEST_JSON */
async function api(path,body){try{return await requestJSON('/api'+path,body);}catch(e){if(e.status===401&&state.me){state.me=null;state.test=null;state.code=null;state.recover=false;render();rememberRoute(true);}throw e;}}
/* ANSWER_SAVE */
async function run(fn){if(busy)return;busy=true;document.documentElement.setAttribute('aria-busy','true');const buttons=[...document.querySelectorAll('#app button:not(:disabled)')];buttons.forEach(b=>b.disabled=true);try{await fn();}catch(e){toast(e.message||'Bağlantı kurulamadı. Tekrar dene.',true);}finally{busy=false;buttons.forEach(b=>b.disabled=false);document.documentElement.removeAttribute('aria-busy');if(pendingHistory)queueMicrotask(flushHistory);}}
function confirmAction(title,text,accept='Devam et'){return new Promise(resolve=>{const d=$('#confirm');$('#confirm-title').textContent=title;$('#confirm-text').textContent=text;$('#accept').textContent=accept;let finished=false;function done(v){if(finished)return;finished=true;d.close();resolve(v);}$('#cancel').onclick=()=>done(false);$('#accept').onclick=()=>done(true);d.oncancel=e=>{e.preventDefault();done(false);};d.showModal();});}
const brand=()=>`<div class="brand"><span class="brand-mark">t</span><div><strong>tarih</strong><small>Soru bankası</small></div></div>`;
const head=(eyebrow,title,sub='')=>`<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1 tabindex="-1">${title}</h1>${sub?`<p class="lead">${sub}</p>`:''}</div><span class="pill"><span class="dot"></span> Yerel pilot</span></div>`;
function welcome(){return `<main id="main" class="welcome"><section class="welcome-left">${brand()}<div class="eyebrow">KPSS Lisans & Ön Lisans</div><h1>Her soruda<br>bir adım ileri.</h1><p>Tarihi bilgilerin arasındaki bağları kur.<br>Sorularını çöz, yanlışlarına yeniden dön.</p><div class="welcome-features"><div class="row">${icon('book')} Beş seçenekli, açıklamalı sorular</div><div class="row">${icon('repeat')} Sana ait bir tekrar listesi</div><div class="row">${icon('chart')} Kaydedilen çalışma ilerlemen</div></div></section><section class="welcome-right"><div class="welcome-form"><span class="pilot-label">ÜCRETSİZ YEREL PİLOT</span><h2>${state.recover?'Kaldığın yerden devam et.':'Bir takma adla başlayalım.'}</h2><p class="muted small">${state.recover?'Daha önce kaydettiğin kurtarma kodunu gir. Profilin ve ilerlemen geri gelsin.':'Üyelik formu yok. Bir takma ad seç; sorular ve ilerlemen bu profile kaydedilsin.'}</p><form id="entry-form"><label class="field">${state.recover?'Kurtarma kodun':'Takma adın'}<input name="${state.recover?'code':'nickname'}" ${state.recover?'autocomplete="off" spellcheck="false"':'autocomplete="nickname" minlength="3" maxlength="20"'} placeholder="${state.recover?'xxxxxxxx-xxxxxxxx-…':'Örneğin: TarihYolcusu'}" required aria-describedby="entry-help"></label><button class="btn full" type="submit">${state.recover?'Profilimi aç':'Sorulara başla'} ${icon('arrow')}</button><p id="entry-help" class="small muted">${state.recover?'Kod, profilinin anahtarıdır. Başkalarıyla paylaşma.':'Bu tarayıcı seni hatırlar. Başka bir cihazdan devam etmek veya tarayıcı verilerin silinirse geri dönmek için profilinden ücretsiz kurtarma kodu oluşturabilirsin.'}</p></form><div class="welcome-bottom">${state.recover?'İlk kez mi geliyorsun?':'Daha önce başladın mı?'} <button class="text-btn" data-action="toggle-recover">${state.recover?'Takma ad seç':'Kodumla giriş yap'}</button></div><p class="small muted" style="margin-top:23px">Soru bankası · ${BANK_TOTAL} soru taslağı<br>Bağımsız çalışma uygulaması; ÖSYM ile bağlantılı değildir.</p></div></section></main>`;}
function shell(content){return `<div class="shell"><aside class="sidebar">${brand()}<nav class="nav" aria-label="Ana menü">${[['home','grid','Soru bankası'],['wrong','repeat','Yanlışlarım'],['progress','chart','İlerlemem'],['profile','user','Profilim']].map(([v,i,t])=>`<button data-view="${v}" class="${state.view===v||v==='home'&&['setup','test','result'].includes(state.view)?'active':''}" ${state.view===v?'aria-current="page"':''}>${icon(i)}<span>${t}</span>${v==='wrong'&&state.me.stats.wrong?`<span class="count">${state.me.stats.wrong}</span>`:''}</button>`).join('')}</nav><div class="sidebar-foot"><b>Bir soru. Bir bağlantı.</b>Küçük tekrarlar, kalıcı bilgiler.<hr class="rule">Lisans & Ön Lisans<br>Yerel deneme sürümü</div></aside><div class="workspace"><header class="topbar"><div class="breadcrumb">KPSS Tarih <span style="margin:0 9px;color:#b4bfcc">/</span> ${labels[state.view]}</div><button class="profile-btn" data-view="profile"><span class="avatar">${esc(state.me.profile.nickname.slice(0,1).toLocaleUpperCase('tr'))}</span><span class="wide-label">${esc(state.me.profile.nickname)}</span></button></header><main id="main" class="content">${!['home','test','setup'].includes(state.view)?resumeCard():''}${content}</main></div></div>`;}
function statCards(){const s=state.me.stats;return `<div class="stats"><div class="stat"><span class="icon-box">${icon('book')}</span><div><strong>${s.seen}<span> / ${state.me.total}</span></strong><span>Gördüğün soru</span></div></div><div class="stat"><span class="icon-box">${icon('target')}</span><div><strong>${s.attempted?Math.round(100*s.correct/s.attempted)+'%':'—'}</strong><span>Doğru cevap oranı</span></div></div><div class="stat"><span class="icon-box">${icon('repeat')}</span><div><strong>${s.wrong}</strong><span>Tekrar bekleyen</span></div></div></div>`;}
function resumeCard(){const a=state.me.activeSummary;if(!state.me.active)return '';return `<section class="resume" aria-label="Yarım kalan test"><div><h2>Yarım kalan testine devam et</h2><p>${esc(a?.topic||'Testin')} · ${a?.mode==='exam'?'Kendini sına':'Pratik yap'}</p><p>${a? a.answered+' / '+a.total+' cevap kaydedildi.':'Kaydedilmiş cevapların korunur.'} Son baktığın sorudan devam edebilirsin.</p>${a?`<div class="track resume-progress"><div style="width:${100*a.answered/a.total}%"></div></div>`:''}</div><button class="btn" data-action="resume">Teste devam et ${icon('arrow')}</button></section>`;}
function home(){const m=state.me;return `${head('KPSS Tarih Soru Bankası','Bugün hangi bilgiyi pekiştirelim?')}${resumeCard()}<div class="intro-grid"><section class="hero"><div class="eyebrow">Bugünün çalışması</div><h2>Bilgini sorularla sınayalım.</h2><p>İslamiyet öncesi Türk tarihi, Türk-İslam devletleri ve Anadolu beylikleri; siyasi gelişmeler, kültür ve uygarlık. Hazır bölümlerin tamamından karma bir test çöz.</p><button class="btn" data-action="setup" data-group="all">${m.active?'Testine devam et':'Karma test oluştur'} ${icon('arrow')}</button><div class="hero-detail"><span>${BANK_TOTAL} açıklamalı soru</span><span>${m.groups.length} çalışma başlığı</span></div></section><section class="card pad goal"><div class="row between goal-head"><h3>Günlük adımın</h3>${icon('target')}</div><div class="goal-number">${m.stats.today} <span>/ 10 cevap</span></div><div class="track" role="progressbar" aria-label="Günlük cevap hedefi" aria-valuenow="${Math.min(m.stats.today,10)}" aria-valuemin="0" aria-valuemax="10"><div style="width:${Math.min(100,m.stats.today*10)}%"></div></div><p class="small muted">${m.stats.today>=10?'Bugünkü hedef tamam. İstersen yanlışlarına tekrar dönebilirsin.':'Kısa bir testle başla. Her cevap, bilgini yoklamak için yeni bir fırsat.'}</p></section></div>${statCards()}<div class="section-head"><h2>Konu konu ilerle</h2><span class="muted">${m.groups.length} çalışma başlığı</span></div><div class="topics">${m.groups.map((g,i)=>`<section class="card topic"><div class="topic-top"><span class="topic-num">${String(i+1).padStart(2,'0')}</span><div><h3>${esc(g.name)}</h3><p>${esc(g.description)}</p></div></div><div class="track"><div style="width:${100*g.seen/g.count}%"></div></div><div class="topic-bottom"><span class="muted">${g.seen} / ${g.count} soru görüldü</span><button class="text-btn" data-action="setup" data-group="${g.id}">Test çöz →</button></div></section>`).join('')}</div><div class="notice">${icon('info')}<div><strong>Soru bankası birlikte şekilleniyor.</strong> Bu pilotta ${BANK_TOTAL} özgün soru taslağı var. Lisans ve önlisans için ortak başlangıç bankasıdır; düzey ayrımı henüz yapılmadı. Sorular kaynak, cevap ve açıklama kontrolünden geçti; öğrenci geri bildirimleriyle geliştiriliyor. Yeni üniteler ve sorular geri bildirimlerle geliştirilecek.</div></div>`;}
function availableQuestions(){return state.group==='wrong'?state.me.stats.wrong:state.group==='all'?state.me.total:state.me.groups.find(g=>g.id===state.group)?.count??0;}
function countOptions(available){return [...[5,10,20].filter(n=>n<=available),...(available>0?['all']:[])];}
function normalizeCount(available){if(!countOptions(available).includes(state.count))state.count='all';}
function renderCountOptions(available){return countOptions(available).map(n=>`<option value="${n}" ${state.count===n?'selected':''}>${n==='all'?'Tamamı ('+available+' soru)':n+' soru'}</option>`).join('');}
function setup(){if(state.me.active)return head('Testine dön','Çalışmana kaldığın yerden devam et.')+resumeCard();const available=availableQuestions();normalizeCount(available);return `${head('Testini hazırla','Kendi ritminde çalış.','Konuyu ve çalışma biçimini seç. Cevapların otomatik kaydedilir.')}<div class="setup-grid"><section class="card pad"><form id="setup-form" class="setting-form"><label class="field">Çalışma başlığı<select name="group">${[{id:'all',name:'Hazır konular · Karma test'},...state.me.groups,...(state.me.stats.wrong?[{id:'wrong',name:'Yanlışlarımı tekrar et'}]:[])].map(g=>`<option value="${g.id}" ${state.group===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label><label class="field">Soru sayısı<select name="count">${renderCountOptions(available)}</select><span class="small muted" id="count-help">Bu başlıkta ${available} soru var.</span></label><fieldset><legend>Çalışma biçimi</legend><div class="choices"><label class="radio-card"><input type="radio" name="mode" value="practice" ${state.mode==='practice'?'checked':''}><div><b>Pratik yap</b><span>Her cevaptan sonra doğru cevap ve gerekçesini gör.</span></div></label><label class="radio-card"><input type="radio" name="mode" value="exam" ${state.mode==='exam'?'checked':''}><div><b>Kendini sına</b><span>Cevapları ve çözümleri testin sonunda incele.</span></div></label></div></fieldset><button class="btn full" type="submit" ${available===0?'disabled':''}>Testi başlat ${icon('arrow')}</button></form></section><aside class="card pad"><span class="icon-box">${icon('book')}</span><h2 style="margin-top:18px">Odaklan, ilişki kur.</h2><ul class="note-list"><li>Her soruda beş seçenek ve tek doğru cevap var.</li><li>Cevabı kaydettiğinde o sorunun seçimi kilitlenir.</li><li>İstersen soruyu boş bırakıp daha sonra dönebilirsin.</li><li>Yanlış cevapların tekrar listene eklenir. Daha sonra doğru çözdüklerin listeden çıkar.</li></ul></aside></div>`;}
function feedback(q){if(q.pendingChoice)return '<div class="answer-feedback" role="status"><p>Cevabının kaydedilip kaydedilmediğini henüz doğrulayamadık. Yeniden göndermeden önce kayıt durumunu kontrol et.</p></div>';if(!q.answer)return q.choice?'<div class="answer-feedback"><p>Cevabın kaydedildi. Doğru cevap ve açıklama, testi bitirdiğinde açılacak.</p></div>':'';return `<section class="answer-feedback" aria-label="Cevap açıklaması"><h3 class="${q.correct?'feedback-good':'feedback-bad'}">${icon(q.correct?'check':'repeat')}${q.correct?'Doğru cevap.':'Bu bilgiyi tekrar ele alalım.'}</h3><p><strong>Doğru cevap: ${q.answer}</strong></p><p style="margin-top:8px">${esc(q.explanation)}</p>${sources(q)}</section>`;}
function sources(q){return q.sources?.length?`<details><summary>Kaynakları incele</summary>${q.sources.map(s=>s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a>`:`<p class="small muted">${esc(s.title)}</p>`).join('')}</details>`:'';}
function testView(){const t=state.test,q=t.questions[state.index],answered=t.questions.filter(q=>q.choice).length;return `${head('KPSS Tarih Soru Bankası',esc(t.topic))}<div class="test-layout"><section class="card question-card"><div class="question-meta"><span>Soru <strong>${state.index+1}</strong> / ${t.questions.length}</span><span>${t.mode==='practice'?'Pratik yap':'Kendini sına'}</span></div><div class="question-main"><p class="eyebrow muted" style="font-size:10px;margin-bottom:16px">${esc(q.topic)}</p>${q.difficulty?`<p class="small muted" data-testid="difficulty" style="margin-bottom:12px">${esc(q.difficulty)} · Editoryal güçlük tahmini</p>`:''}<h2 class="question-stem" id="question-stem">${esc(q.stem)}</h2><div class="options" role="group" aria-labelledby="question-stem">${q.options.map((o,i)=>{const l='ABCDE'[i];return `<button class="option ${q.choice===l||!q.choice&&(q.pendingChoice||state.selected)===l?'selected':''} ${q.answer===l?'correct':''} ${q.answer&&q.choice===l&&!q.correct?'incorrect':''}" data-action="select" data-letter="${l}" aria-pressed="${(q.choice||q.pendingChoice||state.selected)===l}" ${q.choice||q.pendingChoice?'disabled':''}><span class="letter">${l}</span><span>${esc(o)}</span>${q.answer===l?'<span class="small" style="margin-left:auto;color:var(--green)">✓</span>':''}</button>`;}).join('')}</div>${feedback(q)}${reportButton(q)}</div><footer class="question-footer"><button class="btn ghost" data-action="previous" ${state.index===0?'disabled':''}>← Önceki</button>${!q.choice?`<button class="btn" data-action="answer" ${!state.selected&&!q.pendingChoice?'disabled':''}>${q.pendingChoice?'Kayıt durumunu kontrol et':'Cevabı kaydet'} ${icon('check')}</button>`:state.index<t.questions.length-1?'<button class="btn" data-action="next">Sonraki soru →</button>':'<button class="btn" data-action="finish">Sonucu gör →</button>'}${!q.choice&&state.index<t.questions.length-1?'<button class="btn secondary" data-action="next">Sonra çöz →</button>':''}</footer></section><aside class="test-side"><div class="card pad"><h3>Testin özeti</h3><p class="muted" style="margin-top:6px">${answered} cevap kaydedildi</p><div class="track"><div style="width:${100*answered/t.questions.length}%"></div></div><div class="numbers">${t.questions.map((q,i)=>`<button class="number ${q.choice?'answered':''} ${i===state.index?'current':''}" data-action="jump" data-index="${i}" aria-label="${i+1}. soru${q.choice?', cevaplandı':''}" ${i===state.index?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><div class="legend"><span>Cevaplandı</span><span>Boş</span></div><button class="btn secondary full" data-action="finish">Testi bitir</button><button class="btn ghost full pause-test" data-action="pause">Ara ver</button><hr class="rule"><p class="muted">${icon('clock')} Süre baskısı yok.<br>Ara verirsen bu teste kaldığın yerden dönebilirsin.</p></div></aside></div>`;}
function resultAnalysis(t){
 const rows=new Map();let missing=false;
 for(const q of t.questions){const sub=q.subtopic||'Genel';if(!q.subtopic)missing=true;const key=JSON.stringify([q.topic,sub]);if(!rows.has(key))rows.set(key,{topic:q.topic,sub,correct:0,wrong:0,empty:0});const r=rows.get(key);r[!q.choice?'empty':q.correct?'correct':'wrong']++;}
 return `<section aria-labelledby="analysis-heading" data-testid="result-analysis"><div class="section-head" style="margin-top:30px"><h2 id="analysis-heading">Alt başlık analizi</h2></div><p class="analysis-note">Bu dağılım yalnızca bu testteki sorulara dayanır; konuya hâkimiyet ölçümü değildir.${missing?' Alt başlık bilgisi bulunmayan eski sorular “Genel” altında gösterilir.':''}</p><div class="analysis-grid">${[...rows.values()].map(r=>`<article class="card analysis-item"><p class="small muted">${esc(r.topic)}</p><h3>${esc(r.sub)}</h3><div class="analysis-counts"><span><b class="feedback-good" data-count="correct">${r.correct}</b>Doğru</span><span><b class="feedback-bad" data-count="wrong">${r.wrong}</b>Yanlış</span><span><b data-count="empty">${r.empty}</b>Boş</span></div></article>`).join('')}</div></section>`;
}
/* RESULT_REVIEW */
function result(){const t=state.test,correct=t.questions.filter(q=>q.correct).length,wrong=t.questions.filter(q=>q.choice&&!q.correct).length,empty=t.questions.filter(q=>!q.choice).length;return `${head('Çalışma tamamlandı','Bir sonraki adımın daha net.')}<section class="card success-panel"><div class="success-icon">${icon('check')}</div><h2>${esc(t.topic)}</h2><div class="score">${correct}<small> / ${t.questions.length}</small></div><p class="muted">doğru cevap</p><div class="result-stats"><div><b class="feedback-good">${correct}</b><span>Doğru</span></div><div><b class="feedback-bad">${wrong}</b><span>Yanlış</span></div><div><b>${empty}</b><span>Boş</span></div></div><div class="row wrap" style="justify-content:center"><button class="btn" data-action="setup" data-group="all">Yeni test oluştur ${icon('arrow')}</button><button class="btn secondary" data-view="wrong">Yanlışlarıma git</button>${wrong+empty?`<button class="btn secondary" data-action="repeat-result">Yanlış + boşları tekrar çöz (${wrong+empty})</button>`:''}</div></section>${resultAnalysis(t)}<section id="result-review">${resultReview(t)}</section>`;}
function wrongView(){return `${head('Tekrar zamanı','Yanlışların, çalışma rehberin.','Son cevabın yanlış olan sorular burada birikir. Doğru çözdüğünde listeden çıkar.')}${state.wrongs.length?`<div class="row between wrap" style="margin-bottom:22px"><span class="muted">${state.wrongs.length} soru tekrar bekliyor</span><button class="btn" data-action="setup" data-group="wrong">Tekrar testi oluştur ${icon('repeat')}</button></div><div class="card">${state.wrongs.map(q=>`<div class="review-item"><span class="small muted">${esc(q.topic)}</span><p class="stem">${esc(q.stem)}</p></div>`).join('')}</div>`:`<div class="card empty"><span class="icon-box">${icon('check')}</span><h2>Tekrar listen şimdilik boş.</h2><p>${state.me.stats.attempted?'Güzel ilerliyorsun. Yeni sorularla bilgini sınamaya devam edebilirsin.':'İlk testini çözdükten sonra yanlış cevapladığın soruları burada bulacaksın.'}</p><button class="btn" data-action="setup" data-group="all">Test oluştur ${icon('arrow')}</button></div>`}`;}
/* STUDY_SUMMARY */
function progress(){const s=state.me.stats;return `${head('Çalışma günlüğün','Küçük adımlar birikiyor.','İlerlemen yalnızca çözdüğün sorulara dayanır.')}${statCards()}${studySummaryView()}<div class="section-head"><h2>Konu durumun</h2><span class="muted">Son cevabı doğru sorular</span></div><div class="topics">${state.me.groups.map(g=>`<section class="card pad"><h3>${esc(g.name)}</h3><div class="track"><div style="width:${g.mastered/g.count*100}%"></div></div><p class="small muted">${g.mastered} / ${g.count} soruda son cevabın doğru</p></section>`).join('')}</div><div class="section-head" style="margin-top:30px"><h2>Son çalışmaların</h2><span class="muted">${s.attempted} kayıtlı cevap</span></div><section class="card">${state.me.recent.length?state.me.recent.map(t=>`<div class="history-row"><div><h3>${esc(t.topic)}</h3><p>${new Date(t.created_at).toLocaleString('tr-TR',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})} · ${t.correct} doğru / ${t.answered} cevap</p></div><button class="text-btn" data-action="open-result" data-id="${t.id}">İncele →</button></div>`).join(''):'<div class="empty"><h3>İlk testin burada yerini bekliyor.</h3><p>Bitirdiğin testleri ve açıklamalarını buradan yeniden açabilirsin.</p></div>'}</section><p class="small muted" style="margin-top:16px">Doğru cevap oranı, tekrarlar dahil bütün kayıtlı cevaplar üzerinden hesaplanır. Bir KPSS puan tahmini değildir.</p>`;}
function profile(){return `${head('Sana ait çalışma alanı',esc(state.me.profile.nickname))}<div class="profile-grid"><section class="card pad"><span class="icon-box">${icon('key')}</span><h2 style="margin-top:18px">Kurtarma kodun</h2><p>Başka bir cihazda ilerlemene ulaşmak veya oturumun sona ererse geri dönmek için bir kod oluştur. Kodla giriş yaptığında diğer cihazlardaki öğrenci oturumları kapanır. Takma adın tek başına giriş sağlamaz.</p>${state.code?`<code class="recovery-code">${esc(state.code)}</code><p><b>Bu kodu şimdi güvenli bir yere kaydet.</b> Sayfayı yenilediğinde tekrar gösterilmez. Paylaşan kişi profiline erişebilir.</p><button class="btn secondary" data-action="download-code">Kodu dosya olarak kaydet</button>`:`<p>${state.me.profile.hasRecovery?'Bir kurtarma kodun var. Yeni kod oluşturursan eskisi geçersiz olur ve diğer cihazlardaki öğrenci oturumları kapanır.':'Henüz kurtarma kodun yok. İstersen hemen oluşturabilirsin.'}</p><button class="btn" data-action="recovery">${state.me.profile.hasRecovery?'Yeni kod oluştur':'Kurtarma kodu oluştur'}</button>`}</section><section class="card pad"><span class="icon-box">${icon('user')}</span><h2 style="margin-top:18px">Profil ve kayıtlar</h2><p>Takma adın, cevapların ve testlerin bu pilotun sunucusunda saklanır. Bu tarayıcıdaki oturum seni tanır; en fazla 30 gün geçerlidir.</p><p>Başka cihazdan erişim, HTTPS üzerinden yayın hazır olduğunda kullanılabilir. Yerel pilot bu bilgisayarda çalışır.</p><hr class="rule"><p><strong>Pilot kapsamı</strong><br>${BANK_TOTAL} soru · İslamiyet öncesi, Türk-İslam devletleri ve Anadolu beylikleri<br>Konu anlatımı içermez. Cevap açıklamaları soru çözümünün parçasıdır.</p><button class="btn secondary" data-action="logout">Bu cihazda çıkış yap</button><button class="btn ghost" data-action="logout-all">Tüm cihazlarda çıkış yap</button></section><section class="card pad"><h2>Soru bildirimlerin</h2><p>Gönderdiğin hata bildirimlerinin durumunu ve inceleme gerekçelerini takip et.</p><button class="btn secondary" data-view="reports">Bildirimlerim</button><hr class="rule"><a class="small" href="/yonetim">Yönetici girişi →</a></section></div>`;}
function profileDataControls(){return `<section class="card pad" style="margin-top:22px"><h2>Verilerimi sil</h2><p class="muted small" id="delete-help" style="margin:12px 0 20px">İlerlemelerin sen silene kadar korunur. Silme işlemi bu profilin testlerini, cevaplarını ve hata bildirimlerini kalıcı olarak kaldırır; bütün öğrenci oturumlarını kapatır. Geri alınamaz. Yedekler 30 günlük saklama politikasına tabidir; silinen profil geri yükleme sırasında dışarıda bırakılır.</p>${state.me.profile.hasRecovery?`<form id="delete-profile-form"><label class="field">Güncel kurtarma kodun<input name="code" type="password" autocomplete="off" maxlength="72" required aria-describedby="delete-help"></label><label class="field" style="margin:15px 0">Onay için SİL yaz<input name="confirmation" autocomplete="off" maxlength="3" required></label><button class="btn secondary" type="submit" style="color:var(--red)">Profilimi ve verilerimi sil</button></form>`:`<p class="small muted">Silme işlemi için önce yukarıdan kurtarma kodu oluştur. Böylece isteğin bu profile ait olduğunu doğrulayabiliriz.</p>`}</section>`;}
function render(){const views={home,setup,test:testView,result,wrong:wrongView,progress,profile:()=>profile()+profileDataControls(),reports:reportsView};$('#app').innerHTML=state.me?shell((views[state.view]||home)()):welcome();document.title=(state.me?labels[state.view]:'Hoş geldin')+' · Tarih';}
async function reloadMe(){state.me=await api('/me');}
/* REPORTS */
/* NAVIGATION */
document.addEventListener('submit',e=>{
 if(e.target.id!=='delete-profile-form')return;e.preventDefault();const form=e.target,data=Object.fromEntries(new FormData(form));
 run(async()=>{
  if(data.confirmation!=='SİL')throw Error('Silme işlemini SİL yazarak onayla.');
  if(!await confirmAction('Profilin kalıcı olarak silinsin mi?','Bütün testlerin, cevapların, ilerlemen ve hata bildirimlerin silinecek. Kurtarma kodun da geçersiz olacak. Bu işlem geri alınamaz.','Kalıcı olarak sil')){form.reset();return;}
  try{await api('/delete-profile',data);state.me=null;state.code=null;state.test=null;state.recover=false;state.selected=null;state.wrongs=[];state.reports={reports:[],page:1,total:0};state.view='home';showPage({replace:true});toast('Profilin ve çalışma kayıtların silindi.');}finally{form.reset();}
 });
});
document.addEventListener('submit',e=>{if(!['entry-form','setup-form'].includes(e.target.id))return;e.preventDefault();const data=Object.fromEntries(new FormData(e.target));run(async()=>{if(e.target.id==='entry-form'){await api(state.recover?'/recover':'/profile',data);state.view='home';await reloadMe();showPage({replace:true});}else{state.group=data.group;state.mode=data.mode;state.count=data.count==='all'?'all':Number(data.count);rememberRoute(true);const t=await api('/tests',{group:state.group,mode:state.mode,count:state.count});await reloadMe();await openTest(t.id);}});});
document.addEventListener('change',e=>{if(!e.target.closest('#setup-form'))return;const values=Object.fromEntries(new FormData($('#setup-form')));state.group=values.group;state.mode=values.mode;state.count=values.count==='all'?'all':Number(values.count);const available=availableQuestions();normalizeCount(available);if(e.target.name==='group'){$('select[name="count"]').innerHTML=renderCountOptions(available);$('#count-help').textContent=`Bu başlıkta ${available} soru var.`;$('#setup-form button[type="submit"]').disabled=available===0;}rememberRoute(true);});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.view){run(()=>go(b.dataset.view));return;}const action=b.dataset.action;if(!action)return;
  if(action==='review-page'){if(!busy)setReviewPage(b.dataset.page);return;}
  if(action==='toggle-recover'){state.recover=!state.recover;showPage();return;}
  if(action==='select'){state.selected=b.dataset.letter;render();rememberRoute(true);$(`[data-letter="${state.selected}"]`)?.focus();return;}
  if(['next','previous','jump'].includes(action)){state.index=action==='jump'?Number(b.dataset.index):state.index+(action==='next'?1:-1);state.selected=null;showPage();$('#question-stem')?.scrollIntoView({block:'nearest'});return;}
  run(async()=>{
    if(action==='retry-route')await restoreRoute();
    if(action==='setup')await startSetup(b.dataset.group||'all');
    if(action==='resume')await openTest(state.me.active);
    if(action==='repeat-result'){const t=await api('/tests',{group:'review',sourceTest:state.test.id,count:'all',mode:'practice'});await reloadMe();await openTest(t.id);if(t.resumed)toast('Yarım kalan testine döndün. Onu bitirince tekrar testi oluşturabilirsin.');}
    if(action==='pause'){rememberRoute(true);await go('home');toast('Kaydedilmiş cevapların ve son baktığın soru korundu.');}
    if(action==='answer')await saveAnswer();
    if(action==='finish'){const empty=state.test.questions.filter(q=>!q.choice).length;if(empty&&!await confirmAction('Testi bitirelim mi?',`${empty} soru boş kalacak. Sonuç ekranında bütün soruların açıklamalarını görebilirsin.`,'Testi bitir'))return;state.test=await api('/tests/'+state.test.id+'/finish',{});await reloadMe();state.view='result';state.reviewPage=1;showPage({replace:true});}
    if(action==='open-result')await openTest(b.dataset.id);
    if(action==='recovery'){if(state.me.profile.hasRecovery&&!await confirmAction('Yeni kurtarma kodu oluşturulsun mu?','Önceki kod geçersiz olacak. Yeni kodu güvenli bir yere kaydetmen gerekecek.','Yeni kod oluştur'))return;state.code=(await api('/recovery',{})).code;await reloadMe();if(!pendingHistory)render();}
    if(action==='download-code'){const a=document.createElement('a');const u=URL.createObjectURL(new Blob([`Tarih soru bankası — kurtarma kodu\nProfil: ${state.me.profile.nickname}\nKod: ${state.code}\n\nBu kod gizlidir. Profilinize erişim sağlar. Sunucu: ${location.origin}`],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='tarih-kurtarma-kodu.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Kurtarma kodu dosyası hazır. Güvenli bir yerde sakla.');}
    if(action==='logout'||action==='logout-all'){if(!await confirmAction(action==='logout-all'?'Tüm cihazlarda çıkış yapalım mı?':'Bu cihazda çıkış yapalım mı?',state.me.profile.hasRecovery?'Tekrar giriş yapmak için kurtarma kodun gerekecek.':'Kurtarma kodun yok. Çıkış yaparsan bu profile yeniden erişemezsin. Önce kod oluşturmanı öneririz.','Çıkış yap'))return;await api(action==='logout-all'?'/logout-all':'/logout',{});state.me=null;state.code=null;state.test=null;state.recover=false;state.selected=null;showPage({replace:true});}
  });
});
void run(restoreRoute);
</script></body></html>
